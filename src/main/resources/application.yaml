spring:
  application:
    name: ms.productos
  datasource:
    url: jdbc:postgresql://localhost:5432/sonidovivo_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: create-drop       # (o 'create-drop' si quieres que borre todo al reiniciar)
    show-sql: true
    defer-datasource-initialization: true # <-- ESTO ES CLAVE
  
  sql:
    init:
      mode: always
